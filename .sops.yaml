creation_rules:
  # Hosts
  - path_regex: secrets/hosts/rin\.yaml$
    key_groups:
      - age:
          - *admin
          - *host_rin
  - path_regex: secrets/hosts/frieren\.yaml$
    key_groups:
      - age:
          - *admin
          - *host_frieren

